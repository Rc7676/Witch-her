name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Seconds, and catches missing imports before the ~2 minute Android build.
      - name: Check for unresolved references
        run: python3 tools/check_imports.py

      - name: Run game-logic tests
        run: ./gradlew --no-daemon -Phexfall.coreOnly=true :core:test

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hexfall.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hexfall-apk
          path: Hexfall.apk

      # Keep a stable, always-current download link on the Releases page.
      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Hexfall (latest build)"
          body: |
            Auto-built debug APK from the newest commit.

            **Install:** download `Hexfall.apk` on your phone, open it, and
            allow installing from unknown sources when prompted.
            Requires Android 8.0+.
          prerelease: true
          files: Hexfall.apk
